<script>
// SIM-START
// Yazıdaki örnek tablolar. TR ve EN yazıda sütun adları farklı, satırlar aynı.
const TABLES = {
  tr: {
    left: { name: 'musteri', alias: 'm', key: 'id', cols: ['id', 'ad', 'sehir'],
      rows: [{ id: 1, ad: 'A', sehir: 'Ankara' }, { id: 2, ad: 'B', sehir: 'İzmir' }, { id: 3, ad: 'C', sehir: 'Ankara' }] },
    right: { name: 'siparis', alias: 's', key: 'musteri_id', cols: ['id', 'musteri_id', 'tutar', 'tarih'],
      rows: [{ id: 101, musteri_id: 1, tutar: 250, tarih: '2026-01-05' }, { id: 102, musteri_id: 1, tutar: 100, tarih: '2026-02-10' },
             { id: 103, musteri_id: 2, tutar: 400, tarih: '2026-02-11' }, { id: 104, musteri_id: 4, tutar: 80, tarih: '2026-03-01' }] },
    select: [['l', 'ad'], ['r', 'id'], ['r', 'tutar']],
    heads: ['ad', 'siparis_id', 'tutar'],
    amount: 'tutar', nameCol: 'ad'
  },
  en: {
    left: { name: 'customers', alias: 'c', key: 'id', cols: ['id', 'name', 'city'],
      rows: [{ id: 1, name: 'A', city: 'Ankara' }, { id: 2, name: 'B', city: 'Izmir' }, { id: 3, name: 'C', city: 'Ankara' }] },
    right: { name: 'orders', alias: 'o', key: 'customer_id', cols: ['id', 'customer_id', 'amount', 'order_date'],
      rows: [{ id: 101, customer_id: 1, amount: 250, order_date: '2026-01-05' }, { id: 102, customer_id: 1, amount: 100, order_date: '2026-02-10' },
             { id: 103, customer_id: 2, amount: 400, order_date: '2026-02-11' }, { id: 104, customer_id: 4, amount: 80, order_date: '2026-03-01' }] },
    select: [['l', 'name'], ['r', 'id'], ['r', 'amount']],
    heads: ['name', 'order_id', 'amount'],
    amount: 'amount', nameCol: 'name'
  }
};

// JOIN simülasyonu. type: 'inner' | 'left' | 'right' | 'full'.
// on(l, r) verilmezse eşleşme koşulu l[left.key] === r[right.key].
// Sol tablonun her satırı bir olay üretir; RIGHT ve FULL'da ardından eşleşmeyen sağ satırlar gelir.
function join(left, right, type, on) {
  if (!['inner', 'left', 'right', 'full'].includes(type)) throw new Error('bilinmeyen JOIN türü: ' + type);
  const match = on || ((l, r) => l[left.key] !== null && l[left.key] === r[right.key]);
  const keepLeft = type === 'left' || type === 'full';
  const keepRight = type === 'right' || type === 'full';
  const used = right.rows.map(() => false);
  const events = [], rows = [];
  left.rows.forEach((l, li) => {
    const matches = [];
    right.rows.forEach((r, ri) => { if (match(l, r)) { matches.push(ri); used[ri] = true; } });
    const from = rows.length;
    matches.forEach(ri => rows.push({ li, ri }));
    if (!matches.length && keepLeft) rows.push({ li, ri: null });
    events.push({ kind: 'left', li, matches, from, added: rows.length - from, kept: rows.length > from });
  });
  if (keepRight) right.rows.forEach((r, ri) => {
    if (used[ri]) return;
    events.push({ kind: 'right', ri, matches: [], from: rows.length, added: 1, kept: true });
    rows.push({ li: null, ri });
  });
  const nullRows = rows.filter(p => p.li === null || p.ri === null).length;
  return { type, events, rows, nullRows, pairs: rows.length - nullRows };
}

// SELECT listesini uygular: [['l','ad'], ['r','id'], ...] -> değer dizileri (eksik taraf null).
function project(res, left, right, select) {
  return res.rows.map(p => select.map(([side, col]) => {
    const row = side === 'l' ? (p.li === null ? null : left.rows[p.li]) : (p.ri === null ? null : right.rows[p.ri]);
    return row ? row[col] : null;
  }));
}
// SIM-END
</script>

<script>
(function () {
  // Yalnız karşılaştırma için: yazıdaki sonuç tabloları (ad, siparis_id, tutar). Ders bunları göstermez, simülasyonu gösterir.
  const ARTICLE = {
    inner: [['A', 101, 250], ['A', 102, 100], ['B', 103, 400]],
    left:  [['A', 101, 250], ['A', 102, 100], ['B', 103, 400], ['C', null, null]],
    right: [['A', 101, 250], ['A', 102, 100], ['B', 103, 400], [null, 104, 80]],
    full:  [['A', 101, 250], ['A', 102, 100], ['B', 103, 400], ['C', null, null], [null, 104, 80]]
  };
  const TURLER = ['inner', 'left', 'right', 'full'];
  const ETIKET = { inner: 'INNER', left: 'LEFT', right: 'RIGHT', full: 'FULL OUTER' };
  const TUR = t => ETIKET[t] + ' JOIN';
  const RENK = { mavi: '#3F6FB0', kirmizi: '#C8463D', gri: '#A9A19A', koyu: '#3A3A3A',
    krem: '#F5F0E6', hardal: '#E3B23C', soluk: '#6B645D', zemin: '#ECE5D8' };
  const MAX_ROWS = Math.max(...TURLER.map(t => join(TABLES.tr.left, TABLES.tr.right, t).rows.length));

  const fmtRow = r => r.map(v => v === null ? 'NULL' : v).join(' ');

  const DICT = {
    tr: {
      title: 'SQL JOIN, adım adım',
      sub: 'Programlama 101, Bölüm 13 · Veritabanı ve SQL',
      langBtn: 'EN', langAria: 'Switch to English',
      prev: 'Geri', next: 'İleri', play: 'Oynat', pause: 'Durdur',
      prevAria: 'Önceki adım', nextAria: 'Sonraki adım',
      playAria: 'Adımları otomatik oynat', pauseAria: 'Otomatik oynatmayı durdur',
      qAria: t => `JOIN türünü ${TUR(t)} yap`,
      step: (a, b) => `Adım ${a} / ${b}`,
      query: 'Çalışan sorgu',
      result: 'sonuç',
      hint: 'Klavyede ← ve → tuşları da adım değiştirir.',
      scene: t => `${TUR(t)}: solda musteri tablosu, sağda siparis tablosu, altta sonuç tablosu`,
      rowsN: n => `${n} satır`,
      intro: t => {
        const base = 'musteri tablosunun satırları sırayla ele alınır. Her satır için siparis tablosunda musteri_id değeri aynı olan satırlar aranır. ';
        return base + {
          inner: 'INNER JOIN yalnızca iki tarafta da eşleşen satırları getirir.',
          left: 'LEFT JOIN soldaki tablonun bütün satırlarını getirir. Sağda eşleşme yoksa sağ sütunlar NULL olur.',
          right: 'RIGHT JOIN sağdaki tablonun bütün satırlarını getirir. Sol taraf bittikten sonra eşleşmeyen siparişler NULL ile eklenir.',
          full: 'FULL OUTER JOIN iki tarafın da bütün satırlarını getirir. Eşleşmeyen tarafın sütunları NULL olur.'
        }[t];
      },
      matched: (c, ids) => `${c.ad} müşterisi (id ${c.id}) için ${ids.length} sipariş eşleşti: ${ids.join(', ')}. Sonuca ${ids.length} satır eklendi.`,
      keep: (c, t) => `${c.ad} müşterisi (id ${c.id}) için eşleşen sipariş yok. ${TUR(t)} bu satırı yine de getirir, siparis_id ve tutar NULL olur.`,
      drop: (c, t) => `${c.ad} müşterisi (id ${c.id}) için eşleşen sipariş yok. ${TUR(t)} bu satırı sonuca yazmaz.`,
      orphan: (o, t) => `${o.id} numaralı siparişin musteri_id değeri ${o.musteri_id}. musteri tablosunda id ${o.musteri_id} yok. ${TUR(t)} siparişi yine de getirir, ad NULL olur.`,
      final: (n, k) => `Sorgu ${n} satır döndürdü. ` + (k ? `${k} satır NULL ile tamamlandı.` : 'Hiçbir satır NULL ile tamamlanmadı.'),
      cRows: 'Satır', cNull: 'NULL ile tamamlanan', cPair: 'Eşleşen çift',
      trap: (w, o) => `LEFT JOIN'den sonra sağ tablodaki bir sütuna WHERE ile koşul konursa, NULL olan satırlar elenir ve sorgu INNER JOIN gibi davranır. WHERE s.tutar > 200 ile sonuç: ${w}. Koşul ON içine yazılınca (ON s.musteri_id = m.id AND s.tutar > 200): ${o}.`,
      check: (n, ok) => `Yazıdaki tablo: ${n} satır. Simülasyon ${ok ? 'aynı satırları verdi' : 'farklı satırlar verdi'}.`
    },
    en: {
      title: 'SQL JOIN, step by step',
      sub: 'Programming 101, Part 13 · Databases and SQL',
      langBtn: 'TR', langAria: 'Türkçeye geç',
      prev: 'Back', next: 'Next', play: 'Play', pause: 'Pause',
      prevAria: 'Previous step', nextAria: 'Next step',
      playAria: 'Play the steps automatically', pauseAria: 'Pause autoplay',
      qAria: t => `Set the JOIN type to ${TUR(t)}`,
      step: (a, b) => `Step ${a} / ${b}`,
      query: 'Running query',
      result: 'result',
      hint: 'The ← and → keys also change the step.',
      scene: t => `${TUR(t)}: the customers table on the left, the orders table on the right, the result table below`,
      rowsN: n => `${n} row${n === 1 ? '' : 's'}`,
      intro: t => {
        const base = 'The rows of customers are taken one by one. For each row, the orders with the same customer_id are looked up. ';
        return base + {
          inner: 'INNER JOIN returns only the rows that match on both sides.',
          left: 'LEFT JOIN returns every row of the left table. Where there is no match on the right, the right-hand columns are NULL.',
          right: 'RIGHT JOIN returns every row of the right table. After the left side is done, the unmatched orders are added with NULL.',
          full: 'FULL OUTER JOIN returns every row from both sides. The columns of the missing side are NULL.'
        }[t];
      },
      matched: (c, ids) => `Customer ${c.name} (id ${c.id}) matches ${ids.length} order${ids.length === 1 ? '' : 's'}: ${ids.join(', ')}. ${ids.length} row${ids.length === 1 ? ' was' : 's were'} added to the result.`,
      keep: (c, t) => `Customer ${c.name} (id ${c.id}) has no matching order. ${TUR(t)} still returns the row, with order_id and amount set to NULL.`,
      drop: (c, t) => `Customer ${c.name} (id ${c.id}) has no matching order. ${TUR(t)} leaves this row out.`,
      orphan: (o, t) => `Order ${o.id} has customer_id ${o.customer_id}, and customers has no row with id ${o.customer_id}. ${TUR(t)} still returns the order, with name set to NULL.`,
      final: (n, k) => `The query returned ${n} rows. ` + (k ? `${k} of them ${k === 1 ? 'was' : 'were'} filled with NULL.` : 'None of them was filled with NULL.'),
      cRows: 'Rows', cNull: 'Filled with NULL', cPair: 'Matched pairs',
      trap: (w, o) => `If a WHERE condition is placed on a right-table column after a LEFT JOIN, the rows where that column is NULL are removed and the query behaves like an INNER JOIN. With WHERE o.amount > 200 the result is ${w}. With the condition inside ON (ON o.customer_id = c.id AND o.amount > 200): ${o}.`,
      check: (n, ok) => `Table in the post: ${n} rows. The simulation ${ok ? 'gives the same rows' : 'gives different rows'}.`
    }
  };

  // Yerleşimler: geniş ekran ve dar ekran (mobil). Dar ekranda tarih sütunu sorguda kullanılmadığı için gösterilmez.
  const LAYOUTS = {
    wide: {
      vb: [820, 590], fs: 14, venn: [410, 44, 28, 17], vlbl: [410, 100, 17],
      titleY: 132, headY: 142, rowH: 34,
      L: { x: 60, w: [44, 52, 92] }, R: { x: 420, w: [56, 110, 70, 104] }, pill: [58, 24],
      res: { x: 265, w: [80, 120, 90], box: [245, 340, 330, 236], lbl: [263, 366], headY: 390, rowY: 402, rowH: 32 }
    },
    narrow: {
      vb: [400, 506], fs: 13, venn: [200, 36, 24, 14], vlbl: [200, 86, 15],
      titleY: 112, headY: 120, rowH: 30,
      L: { x: 8, w: [26, 40, 62] }, R: { x: 206, w: [36, 92, 58] }, pill: [44, 20],
      res: { x: 75, w: [70, 104, 76], box: [60, 290, 280, 206], lbl: [74, 312], headY: 332, rowY: 340, rowH: 30 }
    }
  };

  const NS = 'http://www.w3.org/2000/svg';
  const $ = id => document.getElementById(id);
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const txt = (attrs, s, parent) => { const t = el('text', attrs, parent); t.textContent = s; return t; };
  const sum = a => a.reduce((x, y) => x + y, 0);

  const reduceMQ = window.matchMedia('(prefers-reduced-motion: reduce)');

  let lang = 'tr', type = 'left', step = 0, timerId = null, layoutKey = null;
  let sim = join(TABLES.tr.left, TABLES.tr.right, type);
  const T = () => DICT[lang];
  const TB = () => TABLES[lang];
  const lastStep = () => sim.events.length + 1;

  // ----- durum -----
  function stateAt(k) {
    const n = sim.events.length;
    if (k === 0) return { ev: null, shown: 0, newFrom: 0 };
    if (k > n) return { ev: null, shown: sim.rows.length, newFrom: sim.rows.length, final: true };
    const ev = sim.events[k - 1];
    return { ev, shown: ev.from + ev.added, newFrom: ev.from };
  }

  // ----- sahne çizimi -----
  function rowY(i) { const L = LAYOUTS[layoutKey]; return L.headY + L.rowH * (i + 1); }

  function drawTable(g, side) {
    const L = LAYOUTS[layoutKey];
    const P = L[side], tb = TB()[side === 'L' ? 'left' : 'right'];
    const head = side === 'L' ? RENK.mavi : RENK.kirmizi;
    const cols = tb.cols.slice(0, P.w.length);
    txt({ x: P.x, y: L.titleY, 'font-size': L.fs + 2, 'font-weight': 800, fill: head }, `${tb.name} ${tb.alias}`, g);
    let x = P.x;
    const W = sum(P.w);
    el('rect', { x: P.x, y: L.headY, width: W, height: L.rowH, rx: 7, fill: head }, g);
    cols.forEach((c, j) => {
      txt({ x: x + P.w[j] / 2, y: L.headY + L.rowH / 2 + L.fs * 0.36, 'text-anchor': 'middle',
        'font-size': L.fs - 1, 'font-weight': 800, fill: RENK.krem }, c, g);
      x += P.w[j];
    });
    tb.rows.forEach((r, i) => {
      const y = rowY(i);
      let cx = P.x;
      cols.forEach((c, j) => {
        el('rect', { x: cx, y, width: P.w[j], height: L.rowH, fill: RENK.zemin, stroke: RENK.krem, 'stroke-width': 2 }, g);
        const isKey = c === tb.key;
        txt({ x: cx + P.w[j] / 2, y: y + L.rowH / 2 + L.fs * 0.36, 'text-anchor': 'middle',
          'font-size': L.fs, 'font-weight': isKey ? 800 : 600, fill: RENK.koyu }, String(r[c]), g);
        cx += P.w[j];
      });
    });
  }

  function drawStatic() {
    const L = LAYOUTS[layoutKey];
    const svg = $('sahne');
    svg.setAttribute('viewBox', `0 0 ${L.vb[0]} ${L.vb[1]}`);
    const g = $('statik');
    g.innerHTML = '';
    // Venn simgesi
    const [vx, vy, vr, vo] = L.venn;
    const defs = el('defs', {}, g);
    const cp = el('clipPath', { id: 'vennSolKes' }, defs);
    el('circle', { cx: vx - vo, cy: vy, r: vr }, cp);
    el('circle', { id: 'vennSol', cx: vx - vo, cy: vy, r: vr, fill: RENK.hardal }, g);
    el('circle', { id: 'vennSag', cx: vx + vo, cy: vy, r: vr, fill: RENK.hardal }, g);
    el('circle', { cx: vx + vo, cy: vy, r: vr, fill: RENK.hardal, 'clip-path': 'url(#vennSolKes)' }, g);
    el('circle', { cx: vx - vo, cy: vy, r: vr, fill: 'none', stroke: RENK.mavi, 'stroke-width': 4 }, g);
    el('circle', { cx: vx + vo, cy: vy, r: vr, fill: 'none', stroke: RENK.kirmizi, 'stroke-width': 4 }, g);
    txt({ id: 'vennEtiket', x: L.vlbl[0], y: L.vlbl[1], 'text-anchor': 'middle', 'font-size': L.vlbl[2],
      'font-weight': 800, fill: RENK.koyu, 'letter-spacing': 1 }, '', g);
    // tablolar
    drawTable(g, 'L');
    drawTable(g, 'R');
    // sonuç alanı
    const R = L.res;
    const [bx, by, bw, bh] = R.box;
    el('rect', { x: bx, y: by, width: bw, height: bh, rx: 16, fill: 'none', stroke: RENK.gri,
      'stroke-width': 4, 'stroke-dasharray': '10 8' }, g);
    txt({ x: R.lbl[0], y: R.lbl[1], 'font-size': L.fs + 1, 'font-weight': 800, fill: RENK.soluk }, T().result, g);
    let x = R.x;
    TB().heads.forEach((h, j) => {
      txt({ x: x + R.w[j] / 2, y: R.headY, 'text-anchor': 'middle', 'font-size': L.fs - 1, 'font-weight': 800,
        fill: j === 0 ? RENK.mavi : RENK.kirmizi }, h, g);
      x += R.w[j];
    });
    updateVenn();
  }

  function updateVenn() {
    $('vennSol').style.display = type === 'left' || type === 'full' ? '' : 'none';
    $('vennSag').style.display = type === 'right' || type === 'full' ? '' : 'none';
    $('vennEtiket').textContent = TUR(type);
  }

  function highlight(g, side, i, color, animate) {
    const L = LAYOUTS[layoutKey], P = L[side];
    const cls = animate ? 'yeni-cizgi' : '';
    el('rect', { x: P.x - 3, y: rowY(i) - 1, width: sum(P.w) + 6, height: L.rowH + 2, rx: 7,
      fill: color, 'fill-opacity': .32, stroke: color, 'stroke-width': 4, class: cls }, g);
  }

  function connector(g, x1, y1, x2, y2, color, animate) {
    const mx = (x1 + x2) / 2;
    const a = { fill: 'none', stroke: color, 'stroke-width': 3.5, 'stroke-dasharray': '9 7', 'stroke-linecap': 'round' };
    if (animate) a.class = 'yeni-cizgi';
    el('path', Object.assign({ d: `M ${x1} ${y1} C ${mx} ${y1} ${mx} ${y2} ${x2} ${y2}` }, a), g);
    el('circle', { cx: x1, cy: y1, r: 4.5, fill: color, class: animate ? 'yeni-cizgi' : '' }, g);
    el('circle', { cx: x2, cy: y2, r: 4.5, fill: color, class: animate ? 'yeni-cizgi' : '' }, g);
  }

  function nullPill(g, cx, cy, animate) {
    const L = LAYOUTS[layoutKey];
    const [w, h] = L.pill;
    const pg = el('g', { class: animate ? 'yeni-cizgi' : '' }, g);
    el('rect', { x: cx - w / 2, y: cy - h / 2, width: w, height: h, rx: 6, fill: RENK.gri }, pg);
    txt({ x: cx, y: cy + (L.fs - 2) * 0.36, 'text-anchor': 'middle', 'font-size': L.fs - 2, 'font-weight': 800,
      fill: RENK.koyu }, 'NULL', pg);
  }

  function drawDynamic(st, animate) {
    const L = LAYOUTS[layoutKey];
    const g = $('dinamik');
    g.innerHTML = '';
    const ev = st.ev;
    const lEnd = L.L.x + sum(L.L.w), rStart = L.R.x;
    const mid = y => y + L.rowH / 2;
    const gapMid = (lEnd + rStart) / 2;
    if (ev && ev.kind === 'left') {
      highlight(g, 'L', ev.li, ev.kept ? RENK.hardal : RENK.gri, animate);
      ev.matches.forEach(ri => {
        highlight(g, 'R', ri, RENK.hardal, animate);
        connector(g, lEnd + 5, mid(rowY(ev.li)), rStart - 5, mid(rowY(ri)), RENK.koyu, animate);
      });
      if (!ev.matches.length && ev.kept) {
        const y = mid(rowY(ev.li));
        connector(g, lEnd + 5, y, gapMid - L.pill[0] / 2 - 4, y, RENK.gri, animate);
        nullPill(g, gapMid, y, animate);
      }
    } else if (ev && ev.kind === 'right') {
      highlight(g, 'R', ev.ri, RENK.hardal, animate);
      const y = mid(rowY(ev.ri));
      connector(g, gapMid + L.pill[0] / 2 + 4, y, rStart - 5, y, RENK.gri, animate);
      nullPill(g, gapMid, y, animate);
    }
    // sonuç satırları
    const sg = $('sonucSatir');
    sg.innerHTML = '';
    const R = L.res;
    const vals = project({ rows: sim.rows }, TB().left, TB().right, TB().select);
    for (let i = 0; i < st.shown; i++) {
      const isNew = animate && !st.final && i >= st.newFrom;
      const rg = el('g', { class: isNew ? 'yeni' : '' }, sg);
      if (isNew) rg.style.animationDelay = (0.25 + (i - st.newFrom) * 0.12) + 's';
      let x = R.x;
      const y = R.rowY + i * R.rowH;
      vals[i].forEach((v, j) => {
        const isNull = v === null;
        const fill = isNull ? RENK.gri : (j === 0 ? RENK.mavi : RENK.kirmizi);
        el('rect', { x: x + 2, y: y + 2, width: R.w[j] - 4, height: R.rowH - 4, rx: 6, fill }, rg);
        txt({ x: x + R.w[j] / 2, y: y + R.rowH / 2 + L.fs * 0.36, 'text-anchor': 'middle', 'font-size': L.fs,
          'font-weight': 800, fill: isNull ? RENK.koyu : RENK.krem }, isNull ? 'NULL' : String(v), rg);
        x += R.w[j];
      });
    }
  }

  // ----- sorgu metni -----
  function drawQuery() {
    const tb = TB(), l = tb.left, r = tb.right, a = l.alias, b = r.alias;
    const q = $('sorgu');
    q.innerHTML = '';
    const add = (s, cls) => {
      if (cls) { const sp = document.createElement('span'); sp.className = cls; sp.textContent = s; q.appendChild(sp); }
      else q.appendChild(document.createTextNode(s));
    };
    add(`SELECT ${a}.${tb.select[0][1]}, ${b}.id AS ${tb.heads[1]}, ${b}.${tb.select[2][1]}\nFROM ${l.name} ${a}\n`);
    add(TUR(type), 'tur');
    add(` ${r.name} ${b}\n  ON ${b}.${r.key} = ${a}.${l.key};`);
    q.setAttribute('aria-label', q.textContent.replace(/\s+/g, ' '));
  }

  // ----- yan panel -----
  function explain(st) {
    const D = T();
    if (st.final) return D.final(sim.rows.length, sim.nullRows);
    if (!st.ev) return D.intro(type);
    const ev = st.ev;
    if (ev.kind === 'right') return D.orphan(TB().right.rows[ev.ri], type);
    const c = TB().left.rows[ev.li];
    const view = Object.assign({}, c, { ad: c[TB().nameCol] });
    if (ev.matches.length) return D.matched(view, ev.matches.map(ri => TB().right.rows[ri].id));
    return ev.kept ? D.keep(view, type) : D.drop(view, type);
  }

  function statusLine(st) {
    const tb = TB();
    if (st.final) return T().rowsN(sim.rows.length);
    if (!st.ev) return TUR(type);
    if (st.ev.kind === 'right') return `${tb.right.alias}.id = ${tb.right.rows[st.ev.ri].id}`;
    return `${tb.left.alias}.id = ${tb.left.rows[st.ev.li].id}`;
  }

  function sameRows(a, b) {
    const k = x => x.map(r => JSON.stringify(r)).sort().join('|');
    return a.length === b.length && k(a) === k(b);
  }

  function drawSummary(show) {
    const box = $('ozet');
    box.hidden = !show;
    if (!show) return;
    const D = T(), tb = TB();
    $('oN').textContent = sim.rows.length;
    $('oNull').textContent = sim.nullRows;
    $('oPair').textContent = sim.pairs;
    const hd = $('tabloBas');
    hd.innerHTML = '';
    tb.heads.forEach(h => { const th = document.createElement('th'); th.textContent = h; hd.appendChild(th); });
    const tbody = $('tablo');
    tbody.innerHTML = '';
    const vals = project(sim, tb.left, tb.right, tb.select);
    vals.forEach(r => {
      const tr = document.createElement('tr');
      r.forEach(v => {
        const td = document.createElement('td');
        if (v === null) { const s = document.createElement('span'); s.className = 'nul'; s.textContent = 'NULL'; td.appendChild(s); }
        else td.textContent = v;
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    // WHERE tuzağı: aynı simülasyonla hesaplanır.
    const L0 = tb.left, R0 = tb.right, amt = tb.amount, nm = tb.nameCol;
    const pick = (res) => project(res, L0, R0, [['l', nm], ['r', amt]]);
    const leftRes = join(L0, R0, 'left');
    const whereRows = pick(leftRes).filter(r => r[1] !== null && r[1] > 200);
    const onRows = pick(join(L0, R0, 'left', (l, r) => l[L0.key] === r[R0.key] && r[amt] > 200));
    $('not').textContent = D.trap(whereRows.map(fmtRow).join(', '), onRows.map(fmtRow).join(', '));
    const exp = ARTICLE[type];
    const ok = sameRows(project(sim, TABLES.tr.left, TABLES.tr.right, TABLES.tr.select), exp);
    $('dogrulama').textContent = D.check(exp.length, ok);
  }

  function render(animate) {
    const st = stateAt(step);
    drawDynamic(st, animate && !reduceMQ.matches);
    const D = T();
    $('sayac').textContent = D.step(step + 1, lastStep() + 1);
    $('zaman').textContent = statusLine(st);
    $('aciklama').textContent = explain(st);
    drawSummary(!!st.final);
    $('geriBtn').disabled = step === 0;
    $('ileriBtn').disabled = step === lastStep();
  }

  function still(fn) {
    $('rr').classList.add('hareketsiz');
    fn();
    requestAnimationFrame(() => requestAnimationFrame(() => $('rr').classList.remove('hareketsiz')));
  }

  // ----- dil -----
  function applyLang() {
    const D = T();
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(n => { n.textContent = D[n.dataset.i18n]; });
    $('dilBtn').textContent = D.langBtn;
    $('dilBtn').setAttribute('aria-label', D.langAria);
    $('geriBtn').textContent = D.prev; $('geriBtn').setAttribute('aria-label', D.prevAria);
    $('ileriBtn').textContent = D.next; $('ileriBtn').setAttribute('aria-label', D.nextAria);
    $('sahneEtiket').textContent = D.scene(type);
    updatePlayBtn();
    document.querySelectorAll('#qGrup button').forEach(b => b.setAttribute('aria-label', D.qAria(b.dataset.t)));
    still(() => { drawStatic(); drawQuery(); render(false); });
  }

  // ----- kontrol -----
  function go(k, animate) {
    const n = Math.max(0, Math.min(lastStep(), k));
    if (n === step) return;
    const back = n < step;
    step = n;
    if (back) still(() => render(false));
    else render(animate);
  }
  function updatePlayBtn() {
    const D = T(), b = $('oynatBtn');
    b.textContent = timerId ? D.pause : D.play;
    b.setAttribute('aria-label', timerId ? D.pauseAria : D.playAria);
    b.setAttribute('aria-pressed', timerId ? 'true' : 'false');
  }
  function stop() { if (timerId) { clearInterval(timerId); timerId = null; updatePlayBtn(); } }
  function play() {
    if (step === lastStep()) go(0, false);
    timerId = setInterval(() => {
      if (step >= lastStep()) { stop(); return; }
      go(step + 1, true);
      if (step >= lastStep()) stop();
    }, reduceMQ.matches ? 1400 : 1900);
    updatePlayBtn();
  }
  function pressType() {
    document.querySelectorAll('#qGrup button').forEach(b =>
      b.setAttribute('aria-pressed', b.dataset.t === type ? 'true' : 'false'));
  }
  function setType(t) {
    stop();
    type = t;
    sim = join(TABLES.tr.left, TABLES.tr.right, type);
    pressType();
    step = 0;
    $('sahneEtiket').textContent = T().scene(type);
    still(() => { updateVenn(); drawQuery(); render(false); });
  }

  TURLER.forEach(t => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'uzun';
    b.dataset.t = t;
    b.textContent = ETIKET[t];
    b.setAttribute('aria-pressed', t === type ? 'true' : 'false');
    b.addEventListener('click', () => setType(t));
    $('qGrup').appendChild(b);
  });
  $('geriBtn').addEventListener('click', () => { stop(); go(step - 1, false); });
  $('ileriBtn').addEventListener('click', () => { stop(); go(step + 1, true); });
  $('oynatBtn').addEventListener('click', () => { timerId ? stop() : play(); });
  $('dilBtn').addEventListener('click', () => { lang = lang === 'tr' ? 'en' : 'tr'; applyLang(); });
  document.addEventListener('keydown', e => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    if (e.key === 'ArrowRight') { stop(); go(step + 1, true); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { stop(); go(step - 1, false); e.preventDefault(); }
  });

  function pickLayout() {
    const w = $('sahneKap').clientWidth;
    const k = w < 520 ? 'narrow' : 'wide';
    if (k !== layoutKey) {
      layoutKey = k;
      still(() => { drawStatic(); render(false); });
    }
  }
  reduceMQ.addEventListener && reduceMQ.addEventListener('change', () => render(false));

  // Adres parametreleri (gömme ve test için): #lang=en&type=full&step=last
  const params = new URLSearchParams(location.hash.slice(1));
  if (params.get('lang') === 'en') lang = 'en';
  const pt = params.get('type');
  if (TURLER.includes(pt)) {
    type = pt; sim = join(TABLES.tr.left, TABLES.tr.right, type);
    pressType();
  }
  layoutKey = $('sahneKap').clientWidth < 520 ? 'narrow' : 'wide';
  const ps = params.get('step');
  if (ps === 'last') step = lastStep();
  else if (ps && !isNaN(ps)) step = Math.max(0, Math.min(lastStep(), Number(ps)));
  applyLang();
  if (window.ResizeObserver) new ResizeObserver(pickLayout).observe($('sahneKap'));
  else window.addEventListener('resize', pickLayout);
})();
</script>
</body>
</html>
