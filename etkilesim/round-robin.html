<style>

}
*{box-sizing:border-box}
html,body{margin:0;background:var(--krem);color:var(--koyu);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;}
body{overflow-x:hidden}
.rr{max-width:1080px;margin:0 auto;padding:24px 16px 40px}
.ust{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font-size:1.45rem;line-height:1.25;margin:0 0 4px;font-weight:800}
.alt{margin:0;color:var(--soluk);font-size:.92rem}
button{font:inherit;color:var(--koyu);background:transparent;border:2px solid var(--koyu);

svg.sahne{width:100%;height:auto;display:block;overflow:visible}
.proc{transition:transform .65s cubic-bezier(.4,.1,.2,1);transform-origin:0 0}
.geri-ok{transition:opacity .4s}
.gantt-kap{margin-top:14px}

.gantt{position:relative;height:42px;background:#ECE5D8;border-radius:8px;overflow:hidden}
.seg{position:absolute;top:0;height:100%;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:.85rem;color:var(--krem);border-right:2px solid var(--krem);
  transition:width .6s ease;white-space:nowrap;overflow:hidden}
.seg.P3{color:var(--koyu)}
.eksen{position:relative;height:20px;margin-top:4px;font-size:.75rem;color:var(--soluk)}
.eksen span{position:absolute;transform:translateX(-50%)}
.eksen span.ilk{transform:none}
.eksen span.son{transform:translateX(-100%)}
.kontrol{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px}
.kontrol .adim-btn{display:flex;gap:8px}
.q-grup{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.q-grup .etiket{font-weight:700;font-size:.9rem;margin-right:2px}
.q-grup button{min-width:40px;padding:6px 0;min-height:36px}
.q-grup button.uzun{padding:6px 10px}
.q-grup button[aria-pressed="true"]{background:var(--hardal);border-color:var(--koyu)}
.ipucu{font-size:.8rem;color:var(--soluk);margin:10px 0 0}
.yan{border-left:3px dashed var(--cizgi);padding-left:22px;min-width:0}
@media (max-width:860px){.yan{border-left:none;padding-left:0;border-top:3px dashed var(--cizgi);padding-top:18px}}
.sayac{font-size:.8rem;font-weight:700;color:var(--soluk);margin:0}
.zaman{font-size:1.6rem;font-weight:800;margin:4px 0 10px}
.aciklama{font-size:1.02rem;line-height:1.55;margin:0;min-height:5.5em}
.ozet{margin-top:16px}
.ozet[hidden]{display:none}
.kartlar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kart{background:#ECE5D8;border-radius:10px;padding:10px 8px}
.kart b{display:block;font-size:1.35rem;font-weight:800}
.kart span{font-size:.72rem;color:var(--soluk);font-weight:700}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:.85rem}
th,td{text-align:right;padding:5px 4px;border-bottom:1px solid var(--cizgi)}
th:first-child,td:first-child{text-align:left}
th{font-size:.72rem;color:var(--soluk)}
tfoot td{font-weight:800;border-bottom:none}
.not{font-size:.92rem;line-height:1.5;margin:12px 0 0}
.dogrulama{font-size:.8rem;color:var(--soluk);margin:8px 0 0}
.gorunmez{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hareketsiz .proc,.hareketsiz .seg,.hareketsiz .geri-ok{transition:none !important}
@media (prefers-reduced-motion: reduce){
  .proc,.seg,.geri-ok{transition:none !important}
}
</style>
</head>

<div class="rr" id="rr">
  <div class="ust">

  <div class="ana">

        <div class="kartlar">
          <div class="kart"><b id="oW"></b><span data-i18n="avgW"></span></div>
          <div class="kart"><b id="oT"></b><span data-i18n="avgT"></span></div>

          <thead><tr><th>Process</th><th data-i18n="thEnd"></th><th>Turnaround</th><th data-i18n="thWait"></th><th data-i18n="thResp"></th></tr></thead>
          <tbody id="tablo"></tbody>
          <tfoot><tr><td data-i18n="avgRow"></td><td></td><td id="fT"></td><td id="fW"></td><td id="fR"></td></tr></tfoot>
        </table>
        <p class="not" id="not"></p>
        <p class="dogrulama" id="dogrulama"></p>
      </div>
    </aside>
  </div>
</div>

<script>
// SIM-START
// Round Robin simülasyonu. procs: [{id, arrival, burst}], kuyruk sırasıyla.
function simulateRR(procs, quantum) {
  const list = procs.map((p, i) => ({
    id: p.id, arrival: p.arrival || 0, burst: p.burst,
    rem: p.burst, order: i, first: null, end: null
  }));
  const pending = list.slice().sort((a, b) => a.arrival - b.arrival || a.order - b.order);
  const ready = [];
  const slices = [];
  let t = 0;
  const admit = (upTo) => { while (pending.length && pending[0].arrival <= upTo) ready.push(pending.shift()); };
  admit(t);
  while (ready.length || pending.length) {
    if (!ready.length) { t = pending[0].arrival; admit(t); }
    const p = ready.shift();
    const run = Math.min(quantum, p.rem);
    const start = t;
    const firstRun = p.first === null;
    if (firstRun) p.first = start;
    const queueDuring = ready.map(x => x.id);
    t += run;
    p.rem -= run;
    admit(t);                       // yeni gelenler, kesilen process'ten önce sıraya girer
    const finished = p.rem === 0;
    if (finished) p.end = t; else ready.push(p);
    slices.push({ id: p.id, start, end: t, run, rem: p.rem, finished, firstRun,
                  queueDuring, queueAfter: ready.map(x => x.id) });
  }
  const rows = list.map(p => ({
    id: p.id, burst: p.burst, arrival: p.arrival, end: p.end,
    turnaround: p.end - p.arrival,
    waiting: p.end - p.arrival - p.burst,
    response: p.first - p.arrival
  }));
  const avg = k => rows.reduce((s, r) => s + r[k], 0) / rows.length;
  let switches = 0;
  for (let i = 1; i < slices.length; i++) if (slices[i].id !== slices[i - 1].id) switches++;
  return { quantum, slices, rows, switches,
           avg: { waiting: avg('waiting'), turnaround: avg('turnaround'), response: avg('response') } };
}
// SIM-END
</script>

<script>
(function () {
  // Yazıdaki örnek: üç process t=0'da gelir, sıra P1, P2, P3.
  const PROCS = [
    { id: 'P1', arrival: 0, burst: 8 },
    { id: 'P2', arrival: 0, burst: 4 },
    { id: 'P3', arrival: 0, burst: 2 }
  ];
  // Yalnız karşılaştırma için: yazıdaki tablo (quantum 2). Ders bu sayıları göstermez, simülasyonu gösterir.
  const ARTICLE = { quantum: 2, waiting: 5.33, turnaround: 10, response: 2 };
  const RENK = { P1: '#3F6FB0', P2: '#C8463D', P3: '#A9A19A' };
  const YAZI = { P1: '#F5F0E6', P2: '#F5F0E6', P3: '#3A3A3A' };
  const Q_SECENEK = [1, 2, 3, 4, 5, 8];
  const maxBurst = Math.max(...PROCS.map(p => p.burst));

  const fmt = (n, lang) => {
    const s = String(Math.round(n * 100) / 100);
    return lang === 'tr' ? s.replace('.', ',') : s;
  };

  const DICT = {
    tr: {
      title: 'Round Robin, adım adım',
      sub: 'Programlama 101, Bölüm 8 · İşletim Sistemi 1',
      langBtn: 'EN', langAria: 'Switch to English',
      prev: 'Geri', next: 'İleri', play: 'Oynat', pause: 'Durdur',
      prevAria: 'Önceki adım', nextAria: 'Sonraki adım',
      playAria: 'Adımları otomatik oynat', pauseAria: 'Otomatik oynatmayı durdur',
      qAria: q => `Quantum değerini ${q} yap`,
      step: (a, b) => `Adım ${a} / ${b}`,
      ready: 'Ready', cpu: 'CPU', done: 'bitti',
      gantt: 'Gantt şeridi',
      hint: 'Klavyede ← ve → tuşları da adım değiştirir.',
      scene: 'Ready kuyruğu, CPU ve bitenler alanı',
      intro: q => `Üç process t=0'da ready kuyruğunda bekliyor: P1 (8), P2 (4), P3 (2). Her biri CPU'da en fazla ${q} birim kalır. Blokların içindeki sayı kalan CPU süresi.`,
      ran: (s) => `${s.id}, t=${s.start} ile t=${s.end} arasında ${s.run} birim çalıştı.`,
      first: (s) => ` İlk tepki süresi ${s.start}.`,
      preempt: (s) => ` Quantum doldu, kalan ${s.rem} birimle kuyruğun sonuna dönüyor.`,
      alone: (s) => ` Quantum doldu ama kuyrukta başka process yok, kalan ${s.rem} birim için yeniden CPU'ya çıkıyor.`,
      finEarly: () => ` Quantum dolmadan işini bitirdi, CPU sıradakine geçiyor.`,
      finExact: () => ` Son birimini de bitirdi, bitenler alanına geçiyor.`,
      finStats: (r) => ` Turnaround ${r.turnaround}, bekleme ${r.waiting}.`,
      final: t => `Son process de t=${t} anında bitti. Ortalamalar aşağıda.`,
      avgW: 'Ort. bekleme', avgT: 'Ort. turnaround', avgR: 'Ort. ilk tepki',
      thEnd: 'Bitiş', thWait: 'Bekleme', thResp: 'İlk tepki', avgRow: 'Ort.',
      noteFcfs: (f, L) => `Quantum en uzun burst'ten (${maxBurst}) küçük değil, bu yüzden hiçbir process bölünmedi. Sıra FCFS ile aynı, ortalama bekleme ${fmt(f.avg.waiting, L)}.`,
      noteRR: (f, n, L) => `Aynı işler FCFS ile çalışsaydı ortalama bekleme ${fmt(f.avg.waiting, L)}, ortalama ilk tepki ${fmt(f.avg.response, L)} olurdu. Bu çalıştırmada ${n} context switch var. Quantum küçüldükçe ilk tepki kısalır, context switch sayısı artar.`,
      check: (ok, L) => `Yazıdaki tablo (quantum ${ARTICLE.quantum}): bekleme ${fmt(ARTICLE.waiting, L)}, turnaround ${ARTICLE.turnaround}, ilk tepki ${ARTICLE.response}. Simülasyon ${ok ? 'aynı sonucu verdi' : 'farklı sonuç verdi'}.`
    },
    en: {
      title: 'Round Robin, step by step',
      sub: 'Programming 101, Part 8 · Operating Systems 1',
      langBtn: 'TR', langAria: 'Türkçeye geç',
      prev: 'Back', next: 'Next', play: 'Play', pause: 'Pause',
      prevAria: 'Previous step', nextAria: 'Next step',
      playAria: 'Play the steps automatically', pauseAria: 'Pause autoplay',
      qAria: q => `Set the quantum to ${q}`,
      step: (a, b) => `Step ${a} / ${b}`,
      ready: 'Ready', cpu: 'CPU', done: 'done',
      gantt: 'Gantt chart',
      hint: 'The ← and → keys also change the step.',
      scene: 'Ready queue, CPU and the finished area',
      intro: q => `Three processes are in the ready queue at t=0: P1 (8), P2 (4), P3 (2). Each one stays on the CPU for at most ${q} units. The number inside a block is its remaining CPU time.`,
      ran: (s) => `${s.id} ran for ${s.run} units, from t=${s.start} to t=${s.end}.`,
      first: (s) => ` Its response time is ${s.start}.`,
      preempt: (s) => ` The quantum ran out, so it goes to the back of the queue with ${s.rem} units left.`,
      alone: (s) => ` The quantum ran out, but no other process is waiting, so it goes back on the CPU for the remaining ${s.rem} units.`,
      finEarly: () => ` It finished before the quantum ran out, and the CPU moves on to the next one.`,
      finExact: () => ` It used its last unit and moves to the finished area.`,
      finStats: (r) => ` Turnaround ${r.turnaround}, waiting ${r.waiting}.`,
      final: t => `The last process finished at t=${t}. The averages are below.`,
      avgW: 'Avg. waiting', avgT: 'Avg. turnaround', avgR: 'Avg. response',
      thEnd: 'Done at', thWait: 'Waiting', thResp: 'Response', avgRow: 'Avg.',
      noteFcfs: (f, L) => `The quantum is not smaller than the longest burst (${maxBurst}), so no process was split. The order is the same as FCFS, average waiting ${fmt(f.avg.waiting, L)}.`,
      noteRR: (f, n, L) => `With FCFS, the same jobs would have an average waiting time of ${fmt(f.avg.waiting, L)} and an average response time of ${fmt(f.avg.response, L)}. This run has ${n} context switches. A smaller quantum shortens the response time and adds context switches.`,
      check: (ok, L) => `Table in the post (quantum ${ARTICLE.quantum}): waiting ${fmt(ARTICLE.waiting, L)}, turnaround ${ARTICLE.turnaround}, response ${ARTICLE.response}. The simulation ${ok ? 'gives the same result' : 'gives a different result'}.`
    }
  };

  // Yerleşimler: geniş ekran ve dar ekran (mobil) için ayrı koordinatlar.
  const LAYOUTS = {
    wide: {
      vb: [820, 320],
      qx: i => 250 - i * 84, qy: 182,
      shelf: [70, 246, 266, 10], readyLbl: [203, 166],
      inArrow: 'M 336 210 H 366',
      chip: [380, 112, 170, 170], cpuLbl: [465, 140],
      cpuX: 430, cpuY: 172,
      timer: [465, 62, 22], timerTxt: [428, 58, 'end'],
      backArrow: 'M 535 104 V 36 Q 535 14 513 14 H 139 Q 117 14 117 36 V 170',
      outArrow: 'M 562 210 H 592',
      doneBox: [604, 142, 200, 130], doneLbl: [618, 166],
      dx: i => 616 + i * 62, dy: 194, ds: 0.8
    },
    narrow: {
      vb: [400, 540],
      qx: i => 270 - i * 90, qy: 44,
      shelf: [80, 106, 270, 10], readyLbl: [200, 28],
      inArrow: 'M 305 124 V 140 Q 305 148 297 148 H 238 Q 230 148 230 156 V 162',
      chip: [125, 172, 150, 150], cpuLbl: [200, 196],
      cpuX: 165, cpuY: 214,
      timer: [334, 214, 22], timerTxt: [334, 266, 'middle'],
      backArrow: 'M 116 247 H 38 Q 22 247 22 231 V 22 Q 22 12 32 12 H 115 Q 125 12 125 22 V 34',
      outArrow: 'M 200 330 V 380',
      doneBox: [40, 392, 320, 120], doneLbl: [56, 416],
      dx: i => 74 + i * 90, dy: 438, ds: 0.9
    }
  };

  const NS = 'http://www.w3.org/2000/svg';
  const $ = id => document.getElementById(id);
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };

  const reduceMQ = window.matchMedia('(prefers-reduced-motion: reduce)');
  const reduced = () => reduceMQ.matches;

  let lang = 'tr', quantum = 2, step = 0, timerId = null, layoutKey = null, saatAnim = null;
  let sim = simulateRR(PROCS, quantum);
  const fcfs = () => simulateRR(PROCS, Infinity);
  const T = () => DICT[lang];
  const lastStep = () => sim.slices.length + 1;

  // ----- durum -----
  function stateAt(k) {
    const S = sim.slices, n = S.length;
    const rem = {}, endAt = {};
    PROCS.forEach(p => { rem[p.id] = p.burst; });
    if (k === 0) return { queue: PROCS.map(p => p.id), running: null, done: [], rem, endAt, slice: null };
    const upto = Math.min(k, n);
    const done = [];
    for (let i = 0; i < upto; i++) {
      const s = S[i];
      rem[s.id] = s.rem;
      if (s.finished) { endAt[s.id] = s.end; if (i < k - 1) done.push(s.id); }
    }
    if (k > n) return { queue: [], running: null, done, rem, endAt, slice: null, final: true };
    const s = S[k - 1];
    return { queue: s.queueDuring, running: s.id, done, rem, endAt, slice: s };
  }

  // ----- sahne çizimi -----
  function arrowHead(defs) {
    const m = el('marker', { id: 'okBasi', viewBox: '0 0 10 10', refX: '6', refY: '5',
      markerWidth: '4.2', markerHeight: '4.2', orient: 'auto-start-reverse' }, defs);
    el('path', { d: 'M 0 0 L 10 5 L 0 10 z', fill: '#3A3A3A' }, m);
  }

  function drawStatic() {
    const L = LAYOUTS[layoutKey];
    const svg = $('sahne');
    svg.setAttribute('viewBox', `0 0 ${L.vb[0]} ${L.vb[1]}`);
    const g = $('statik');
    g.innerHTML = '';
    const defs = el('defs', {}, g);
    arrowHead(defs);
    const ok = { fill: 'none', stroke: '#3A3A3A', 'stroke-width': 5, 'stroke-dasharray': '11 8',
      'stroke-linecap': 'round', 'marker-end': 'url(#okBasi)' };
    // raf
    el('rect', { x: L.shelf[0], y: L.shelf[1], width: L.shelf[2], height: L.shelf[3], rx: 5, fill: '#A9A19A' }, g);
    const rl = el('text', { x: L.readyLbl[0], y: L.readyLbl[1], 'text-anchor': 'middle',
      'font-size': 16, 'font-weight': 800, fill: '#3A3A3A' }, g);
    rl.textContent = T().ready;
    // oklar
    el('path', Object.assign({ d: L.inArrow }, ok), g);
    const back = el('path', Object.assign({ d: L.backArrow, id: 'geriOk', class: 'geri-ok' }, ok), g);
    back.style.opacity = .2;
    el('path', Object.assign({ d: L.outArrow }, ok), g);
    // çip ve bacakları
    const [cx, cy, cw, ch] = L.chip;
    const pin = { fill: '#3A3A3A' };
    for (let i = 0; i < 4; i++) {
      const off = 26 + i * ((cw - 52) / 3);
      el('rect', Object.assign({ x: cx + off - 4, y: cy - 14, width: 8, height: 18, rx: 3 }, pin), g);
      el('rect', Object.assign({ x: cx + off - 4, y: cy + ch - 4, width: 8, height: 18, rx: 3 }, pin), g);
      el('rect', Object.assign({ x: cx - 14, y: cy + off - 4, width: 18, height: 8, rx: 3 }, pin), g);
      el('rect', Object.assign({ x: cx + cw - 4, y: cy + off - 4, width: 18, height: 8, rx: 3 }, pin), g);
    }
    el('rect', { x: cx, y: cy, width: cw, height: ch, rx: 20, fill: '#3A3A3A' }, g);
    const cl = el('text', { x: L.cpuLbl[0], y: L.cpuLbl[1], 'text-anchor': 'middle',
      'font-size': 15, 'font-weight': 800, fill: '#F5F0E6', 'letter-spacing': 2 }, g);
    cl.textContent = T().cpu;
    // bitenler alanı
    const [bx, by, bw, bh] = L.doneBox;
    el('rect', { x: bx, y: by, width: bw, height: bh, rx: 16, fill: 'none', stroke: '#A9A19A',
      'stroke-width': 4, 'stroke-dasharray': '10 8' }, g);
    const dl = el('text', { x: L.doneLbl[0], y: L.doneLbl[1], 'font-size': 15, 'font-weight': 800, fill: '#6B645D' }, g);
    dl.textContent = T().done;

    // süre sayacı (kronometre)
    const s = $('saat');
    s.innerHTML = '';
    const [tx, ty, tr] = L.timer;
    el('rect', { x: tx - 7, y: ty - tr - 14, width: 14, height: 8, rx: 2, fill: '#E3B23C' }, s);
    el('rect', { x: tx - 2.5, y: ty - tr - 8, width: 5, height: 8, fill: '#E3B23C' }, s);
    el('circle', { cx: tx, cy: ty, r: tr, fill: 'none', stroke: '#E3B23C', 'stroke-width': 6 }, s);
    el('path', { id: 'saatDolu', fill: '#E3B23C', opacity: .45 }, s);
    el('line', { id: 'saatIbre', x1: tx, y1: ty, x2: tx, y2: ty - tr + 7, stroke: '#3A3A3A',
      'stroke-width': 4, 'stroke-linecap': 'round' }, s);
    el('circle', { cx: tx, cy: ty, r: 4, fill: '#3A3A3A' }, s);
    const [ax, ay, anc] = L.timerTxt;
    const t1 = el('text', { id: 'saatT', x: ax, y: ay, 'text-anchor': anc, 'font-size': 20, 'font-weight': 800, fill: '#3A3A3A' }, s);
    t1.textContent = 't = 0';
    const t2 = el('text', { id: 'saatQ', x: ax, y: ay + 20, 'text-anchor': anc, 'font-size': 13, 'font-weight': 700, fill: '#6B645D' }, s);
    t2.textContent = '';

    // process blokları
    const pg = $('procs');
    pg.innerHTML = '';
    PROCS.forEach(p => {
      const b = el('g', { class: 'proc', id: 'blok-' + p.id }, pg);
      el('rect', { x: 0, y: 0, width: 70, height: 56, rx: 11, fill: RENK[p.id] }, b);
      const a = el('text', { x: 35, y: 27, 'text-anchor': 'middle', 'font-size': 20, 'font-weight': 800, fill: YAZI[p.id] }, b);
      a.textContent = p.id;
      el('text', { class: 'kalan', x: 35, y: 46, 'text-anchor': 'middle', 'font-size': 13, 'font-weight': 700, fill: YAZI[p.id] }, b);
    });
  }

  function setTimer(tNow, used) {
    const L = LAYOUTS[layoutKey];
    const [tx, ty, tr] = L.timer;
    const q = quantum === Infinity ? used || 1 : quantum;
    const frac = Math.max(0, Math.min(1, used / q));
    const ang = frac * 2 * Math.PI;
    const ib = $('saatIbre');
    ib.setAttribute('x2', tx + Math.sin(ang) * (tr - 7));
    ib.setAttribute('y2', ty - Math.cos(ang) * (tr - 7));
    const d = $('saatDolu');
    if (frac <= 0) d.setAttribute('d', '');
    else if (frac >= 1) d.setAttribute('d', `M ${tx} ${ty - tr + 3} A ${tr - 3} ${tr - 3} 0 1 1 ${tx - 0.01} ${ty - tr + 3} Z`);
    else {
      const r = tr - 3;
      const x = tx + Math.sin(ang) * r, y = ty - Math.cos(ang) * r;
      d.setAttribute('d', `M ${tx} ${ty} L ${tx} ${ty - r} A ${r} ${r} 0 ${frac > .5 ? 1 : 0} 1 ${x} ${y} Z`);
    }
    $('saatT').textContent = 't = ' + fmt(tNow, lang);
    $('saatQ').textContent = `quantum ${fmt(used, lang)}/${quantum}`;
  }

  function runTimer(st, animate) {
    if (saatAnim) cancelAnimationFrame(saatAnim);
    if (!st.slice) {
      const tEnd = st.final ? sim.slices[sim.slices.length - 1].end : 0;
      setTimer(tEnd, 0);
      if (st.final) $('saatQ').textContent = '';
      return;
    }
    const s = st.slice;
    if (!animate || reduced()) { setTimer(s.end, s.run); return; }
    const dur = 650, t0 = performance.now();
    const tick = now => {
      const f = Math.min(1, (now - t0) / dur);
      const used = Math.floor(f * s.run * 100) / 100;
      setTimer(f === 1 ? s.end : Math.floor(s.start + f * s.run), f === 1 ? s.run : used);
      if (f < 1) saatAnim = requestAnimationFrame(tick);
    };
    setTimer(s.start, 0);
    saatAnim = requestAnimationFrame(tick);
  }

  function placeBlocks(st) {
    const L = LAYOUTS[layoutKey];
    const pos = {};
    st.queue.forEach((id, i) => { pos[id] = { x: L.qx(i), y: L.qy, s: 1 }; });
    if (st.running) pos[st.running] = { x: L.cpuX, y: L.cpuY, s: 1 };
    st.done.forEach((id, i) => { pos[id] = { x: L.dx(i), y: L.dy, s: L.ds }; });
    PROCS.forEach(p => {
      const b = $('blok-' + p.id);
      const q = pos[p.id];
      b.style.transform = `translate(${q.x}px, ${q.y}px) scale(${q.s})`;
      b.querySelector('.kalan').textContent =
        st.done.includes(p.id) ? 't=' + st.endAt[p.id] : String(st.rem[p.id]);
    });
    const back = $('geriOk');
    const s = st.slice;
    back.style.opacity = s && !s.finished ? 1 : .2;
  }

  // ----- Gantt -----
  function drawGantt(k, animate) {
    const g = $('gantt'), ax = $('eksen');
    g.innerHTML = ''; ax.innerHTML = '';
    const S = sim.slices;
    const total = S[S.length - 1].end;
    const upto = Math.min(k, S.length);
    const marks = [0];
    for (let i = 0; i < upto; i++) {
      const s = S[i];
      const d = document.createElement('div');
      d.className = 'seg ' + s.id;
      d.style.left = (s.start / total * 100) + '%';
      d.style.background = RENK[s.id];
      d.textContent = s.id;
      d.title = `${s.id}: ${s.start}–${s.end}`;
      const w = (s.run / total * 100) + '%';
      const grow = animate && !reduced() && i === upto - 1 && k <= S.length;
      d.style.width = grow ? '0%' : w;
      g.appendChild(d);
      if (grow) requestAnimationFrame(() => requestAnimationFrame(() => { d.style.width = w; }));
      marks.push(s.end);
    }
    const narrow = layoutKey === 'narrow';
    marks.forEach((m, i) => {
      if (narrow && i !== 0 && i !== marks.length - 1 && total > 10 && sim.slices.length > 10 && m % 2) return;
      const sp = document.createElement('span');
      sp.textContent = m;
      sp.style.left = (m / total * 100) + '%';
      if (m === 0) sp.className = 'ilk';
      else if (m === total) sp.className = 'son';
      ax.appendChild(sp);
    });
    g.setAttribute('aria-label', T().gantt + ': ' +
      S.slice(0, upto).map(s => `${s.id} ${s.start}–${s.end}`).join(', '));
    g.setAttribute('role', 'img');
  }

  // ----- yan panel -----
  function explain(st) {
    const D = T();
    if (st.final) return D.final(sim.slices[sim.slices.length - 1].end);
    if (!st.slice) return D.intro(quantum === Infinity ? '∞' : quantum);
    const s = st.slice;
    let txt = D.ran(s);
    if (s.firstRun) txt += D.first(s);
    if (s.finished) {
      txt += s.run < quantum ? D.finEarly() : D.finExact();
      txt += D.finStats(sim.rows.find(r => r.id === s.id));
    } else {
      txt += s.queueAfter.length === 1 && s.queueDuring.length === 0 ? D.alone(s) : D.preempt(s);
    }
    return txt;
  }

  function drawSummary(show) {
    const box = $('ozet');
    box.hidden = !show;
    if (!show) return;
    const D = T(), L = lang;
    $('oW').textContent = fmt(sim.avg.waiting, L);
    $('oT').textContent = fmt(sim.avg.turnaround, L);
    $('oR').textContent = fmt(sim.avg.response, L);
    $('fW').textContent = fmt(sim.avg.waiting, L);
    $('fT').textContent = fmt(sim.avg.turnaround, L);
    $('fR').textContent = fmt(sim.avg.response, L);
    const tb = $('tablo');
    tb.innerHTML = '';
    sim.rows.forEach(r => {
      const tr = document.createElement('tr');
      [r.id, r.end, r.turnaround, r.waiting, r.response].forEach(v => {
        const td = document.createElement('td'); td.textContent = v; tr.appendChild(td);
      });
      tb.appendChild(tr);
    });
    const f = fcfs();
    const sameAsFcfs = sim.slices.length === f.slices.length &&
      sim.slices.every((s, i) => s.id === f.slices[i].id && s.end === f.slices[i].end);
    $('not').textContent = sameAsFcfs ? D.noteFcfs(f, L) : D.noteRR(f, sim.switches, L);
    const chk = $('dogrulama');
    if (quantum === ARTICLE.quantum) {
      const ok = Math.abs(sim.avg.waiting - ARTICLE.waiting) < 0.01 &&
        Math.abs(sim.avg.turnaround - ARTICLE.turnaround) < 0.01 &&
        Math.abs(sim.avg.response - ARTICLE.response) < 0.01;
      chk.textContent = D.check(ok, L);
      chk.hidden = false;
    } else { chk.textContent = ''; chk.hidden = true; }
  }

  function render(animate) {
    const st = stateAt(step);
    placeBlocks(st);
    runTimer(st, animate);
    drawGantt(step, animate);
    const D = T();
    $('sayac').textContent = D.step(step + 1, lastStep() + 1);
    $('zaman').textContent = st.slice ? `t = ${st.slice.start}–${st.slice.end}`
      : 't = ' + (st.final ? sim.slices[sim.slices.length - 1].end : 0);
    $('aciklama').textContent = explain(st);
    drawSummary(!!st.final);
    $('geriBtn').disabled = step === 0;
    $('ileriBtn').disabled = step === lastStep();
  }

  // ----- dil -----
  function applyLang() {
    const D = T();
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(n => { n.textContent = D[n.dataset.i18n]; });
    $('dilBtn').textContent = D.langBtn;
    $('dilBtn').setAttribute('aria-label', D.langAria);
    $('geriBtn').textContent = D.prev; $('geriBtn').setAttribute('aria-label', D.prevAria);
    $('ileriBtn').textContent = D.next; $('ileriBtn').setAttribute('aria-label', D.nextAria);
    $('sahneEtiket').textContent = D.scene;
    updatePlayBtn();
    document.querySelectorAll('#qGrup button').forEach(b => b.setAttribute('aria-label', D.qAria(b.dataset.q)));
    drawStatic();
    $('rr').classList.add('hareketsiz');
    render(false);
    requestAnimationFrame(() => $('rr').classList.remove('hareketsiz'));
  }

  // ----- kontrol -----
  function go(k, animate) {
    const n = Math.max(0, Math.min(lastStep(), k));
    if (n === step) return;
    const back = n < step;
    step = n;
    if (back) {
      $('rr').classList.add('hareketsiz');
      render(false);
      requestAnimationFrame(() => requestAnimationFrame(() => $('rr').classList.remove('hareketsiz')));
    } else render(animate);
  }
  function updatePlayBtn() {
    const D = T(), b = $('oynatBtn');
    b.textContent = timerId ? D.pause : D.play;
    b.setAttribute('aria-label', timerId ? D.pauseAria : D.playAria);
    b.setAttribute('aria-pressed', timerId ? 'true' : 'false');
  }
  function stop() { if (timerId) { clearInterval(timerId); timerId = null; updatePlayBtn(); } }
  function play() {
    if (step === lastStep()) go(0, false);
    timerId = setInterval(() => {
      if (step >= lastStep()) { stop(); return; }
      go(step + 1, true);
      if (step >= lastStep()) stop();
    }, reduced() ? 1400 : 1700);
    updatePlayBtn();
  }
  function setQuantum(q) {
    stop();
    quantum = q;
    sim = simulateRR(PROCS, quantum);
    document.querySelectorAll('#qGrup button').forEach(b =>
      b.setAttribute('aria-pressed', Number(b.dataset.q) === q ? 'true' : 'false'));
    step = 0;
    $('rr').classList.add('hareketsiz');
    render(false);
    requestAnimationFrame(() => requestAnimationFrame(() => $('rr').classList.remove('hareketsiz')));
  }

  Q_SECENEK.forEach(q => {
    const b = document.createElement('button');
    b.type = 'button';
    b.dataset.q = q;
    b.textContent = q;
    b.setAttribute('aria-pressed', q === quantum ? 'true' : 'false');
    b.addEventListener('click', () => setQuantum(q));
    $('qGrup').appendChild(b);
  });
  $('geriBtn').addEventListener('click', () => { stop(); go(step - 1, false); });
  $('ileriBtn').addEventListener('click', () => { stop(); go(step + 1, true); });
  $('oynatBtn').addEventListener('click', () => { timerId ? stop() : play(); });
  $('dilBtn').addEventListener('click', () => { lang = lang === 'tr' ? 'en' : 'tr'; applyLang(); });
  document.addEventListener('keydown', e => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    if (e.key === 'ArrowRight') { stop(); go(step + 1, true); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { stop(); go(step - 1, false); e.preventDefault(); }
  });

  function pickLayout() {
    const w = $('sahneKap').clientWidth;
    const k = w < 520 ? 'narrow' : 'wide';
    if (k !== layoutKey) {
      layoutKey = k;
      drawStatic();
      $('rr').classList.add('hareketsiz');
      render(false);
      requestAnimationFrame(() => requestAnimationFrame(() => $('rr').classList.remove('hareketsiz')));
    }
  }
  reduceMQ.addEventListener && reduceMQ.addEventListener('change', () => render(false));

  // Adres parametreleri (gömme ve test için): #lang=en&q=3&step=last
  const params = new URLSearchParams(location.hash.slice(1));
  if (params.get('lang') === 'en') lang = 'en';
  const pq = Number(params.get('q'));
  if (Q_SECENEK.includes(pq)) {
    quantum = pq; sim = simulateRR(PROCS, quantum);
    document.querySelectorAll('#qGrup button').forEach(b =>
      b.setAttribute('aria-pressed', Number(b.dataset.q) === pq ? 'true' : 'false'));
  }
  layoutKey = $('sahneKap').clientWidth < 520 ? 'narrow' : 'wide';
  const ps = params.get('step');
  if (ps === 'last') step = lastStep();
  else if (ps && !isNaN(ps)) step = Math.max(0, Math.min(lastStep(), Number(ps)));
  $('rr').classList.add('hareketsiz');
  applyLang();
  if (window.ResizeObserver) new ResizeObserver(pickLayout).observe($('sahneKap'));
  else window.addEventListener('resize', pickLayout);
})();
</script>
</body>
</html>
